logLevel: info
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 1024

authMethod: internal
authInternalUsers:
  # Default unprivileged user.
  # Username. 'any' means any user, including anonymous ones.
  - user: any
    # Password. Not used in case of 'any' user.
    pass:
    # IPs or networks allowed to use this user. An empty list means any IP.
    ips: []
    # Permissions.
    permissions:
    - action: read
      path: video-stream
    - action: playback
      path: video-stream
    - action: publish
      path: video-stream
api: false
metrics: false
pprof: false
playback: false


srt: false
rtsp: false
webrtc: false

rtmp: true
rtmpAddress: :1935

hls: true
hlsAddress: :8888
hlsTrustedProxies: [172.19.0.0/16]
hlsAlwaysRemux: true
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 500ms
hlsSegmentMaxSize: 50M

paths:
  video-stream:
    source: publisher
